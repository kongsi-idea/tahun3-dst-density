<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>浮沉实验室</title>
<meta name="description" content="三年级科学 DSKP 7.1 · 浮沉与密度互动实验室" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232F5BEA' d='M9 2v6.3L4.3 18a2 2 0 0 0 1.8 3h11.8a2 2 0 0 0 1.8-3L15 8.3V2' fill='none' stroke='%232F5BEA' stroke-width='1.8'/%3E%3Cpath d='M8 2h8' fill='none' stroke='%232F5BEA' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M6 15h12v5.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1Z' fill='%233C9DC2'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2v6.3L4.3 18a2 2 0 0 0 1.8 3h11.8a2 2 0 0 0 1.8-3L15 8.3V2"/>
          <path d="M8 2h8"/>
          <path d="M6.4 15h11.2"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>浮沉实验室</strong>
        <small>三年级科学 · 7.1</small>
      </span>
    </div>

    <nav class="topbar-steps" id="topSteps" aria-label="实验站导航"></nav>

    <div class="topbar-controls">
      <button type="button" id="dataToggle" class="toggle-switch" aria-pressed="false" aria-label="显示数据（密度数值）">
        <span class="toggle-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19v-6"/></svg>
        </span>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">显示数据</span>
      </button>
      <div class="segmented" id="modeSeg" role="group" aria-label="模式切换">
        <button type="button" class="seg-btn is-active" data-mode="self">自学</button>
        <button type="button" class="seg-btn" data-mode="teacher">老师</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="panel task-panel" id="taskPanel" aria-label="任务卡"></aside>

    <main class="panel stage-panel">
      <div class="tank-toolbar" id="tankToolbar"></div>
      <div class="tank-stage" id="tankStage" aria-label="实验水槽"></div>
    </main>

    <aside class="panel record-panel" id="recordPanel" aria-label="实验记录"></aside>
  </div>

  <footer class="app-footer">课堂点子铺 · 浮沉机制概念参考 PhET Density（科罗拉多大学），界面与程序为原创实现 · v2.0</footer>
</div>

<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
