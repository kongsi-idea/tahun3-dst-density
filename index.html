<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="三年级科学 DSKP 7.1 密度：3D 厨房浮沉实验，含称重、救鸡蛋、液体分层与发现卡。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M10 4h12M12 4v8L5.5 25a2 2 0 0 0 1.8 3h17.4a2 2 0 0 0 1.8-3L20 12V4%27 fill=%27%23fbefd2%27 stroke=%27%23a8700c%27 stroke-width=%272%27/%3E%3C/svg%3E">
<script src="https://kongsi-idea.vercel.app/data/track-use.js" data-slug="tahun3-dst-density" defer></script>

<body>
<title>浮沉实验室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 布局：全屏 3D 厨房为主角；上方环节切换、左侧任务卡、下方物品架都浮在场景上。单一厨房视觉世界（不随深浅色切换） */
:root {
  color-scheme: light;
  --ink: #2a241f; --ink-2: #6a5d50; --ink-3: #9a8b7b;
  --panel: rgba(255, 251, 244, .92); --panel-solid: #fffbf4; --line: rgba(60, 40, 20, .14);
  --accent: #e2a21c; --accent-deep: #a8700c; --accent-soft: #fbefd2;
  --float: #1d7a4c; --float-soft: #e2f3ea; --sink: #b5432b; --sink-soft: #f9e6e0; --mid: #b27a12; --mid-soft: #fbf0d9;
  --water: #2f8fb5;
  --font-display: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #efe3d1; color: var(--ink); font-family: var(--font-body); }
#app { position: fixed; inset: 0; background: linear-gradient(#f3e6d3, #e9d6bb); color: var(--ink); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c.grabbing { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
button { font-family: var(--font-body); }
button:focus-visible { outline: 3px solid var(--accent-deep); outline-offset: 2px; }

/* 顶栏 */
.top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; align-items: center; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex: none; }
.brand svg { width: 34px; height: 34px; color: var(--accent-deep); flex: none; }
.brand .name { font-family: var(--font-display); font-size: 23px; line-height: 1.1; letter-spacing: .02em; white-space: nowrap; }
.mods { display: flex; gap: 4px; padding: 5px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.mod { position: relative; border: 0; background: transparent; border-radius: 13px; min-height: 52px; padding: 0 14px 0 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); font-size: 16px; font-weight: 500; white-space: nowrap; }
.mod b { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 15px; background: var(--accent-soft); color: var(--accent-deep); flex: none; }
.mod[aria-current="true"] { background: var(--accent); color: #2a241f; font-weight: 700; }
.mod[aria-current="true"] b { background: #fff7e2; }
.mod.done b { background: var(--float); color: #fff; }
.mod.done b::after { content: ""; }
.top-right { display: flex; gap: 8px; flex: none; }
.icon-btn { width: 52px; height: 52px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* 左侧任务卡 */
.panel { position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 80px); bottom: 150px; width: 330px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(60, 35, 10, .12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); overflow: hidden; }
.panel[hidden] { display: none; }
.p-head { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.p-kicker { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-3); letter-spacing: .04em; }
.p-kicker .dskp { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); }
.p-title { font-family: var(--font-display); font-size: 25px; line-height: 1.2; margin: 6px 0 4px; text-wrap: balance; }
.p-goal { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); margin: 0; }
.p-body { flex: 1; overflow-y: auto; padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 12px; font-size: 15.5px; line-height: 1.45; color: var(--ink-3); }
.step .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.step.now { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.step.now .dot { border-color: var(--accent); background: var(--accent); color: #2a241f; }
.step.ok { color: var(--ink-2); }
.step.ok .dot { border-color: var(--float); background: var(--float); color: #fff; }
.sec-title { font-size: 13px; font-weight: 700; color: var(--ink-3); letter-spacing: .06em; margin: 0 0 6px; }
.big-btn { width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--accent); color: #2a241f; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.big-btn.ghost { background: transparent; border: 1.5px solid var(--line); font-weight: 500; }
.big-btn:active, .choice:active, .chip:active { transform: scale(.97); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 15.5px; font-weight: 500; cursor: pointer; color: var(--ink); padding: 6px 8px; line-height: 1.3; }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.note { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); padding: 10px 12px; background: #fff; border-radius: 12px; border: 1px solid var(--line); }
.note b { color: var(--ink); }

/* 记录 */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.col { border-radius: 12px; padding: 8px; min-height: 92px; display: flex; flex-direction: column; gap: 6px; }
.col.f { background: var(--float-soft); }
.col.s { background: var(--sink-soft); }
.col h4 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 4px; }
.col.f h4 { color: var(--float); } .col.s h4 { color: var(--sink); }
.col h4 svg { width: 16px; height: 16px; }
.rec { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 9px; padding: 3px 6px 3px 3px; font-size: 14px; }
.rec img { width: 30px; height: 30px; object-fit: contain; }
.rec .mk { margin-left: auto; font-size: 12px; font-weight: 700; }
.rec .mk.y { color: var(--float); } .rec .mk.n { color: var(--sink); }
.empty { font-size: 13px; color: var(--ink-3); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font-size: 12.5px; color: var(--ink-3); font-weight: 700; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.t td.num { font-family: var(--font-mono); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; }
.pill.f { background: var(--float); } .pill.s { background: var(--sink); } .pill.m { background: var(--mid); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 72px 1fr 64px; gap: 8px; align-items: center; font-size: 14px; }
.bar i { display: block; height: 16px; border-radius: 6px; background: var(--accent); }
.bar.w i { background: var(--water); }
.bar span { font-family: var(--font-mono); font-weight: 600; text-align: right; }
.stack { display: flex; flex-direction: column-reverse; gap: 3px; }
.stack .lay { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; font-size: 14.5px; font-weight: 500; color: #2a241f; border: 1px solid rgba(0,0,0,.08); }
.stack .lay small { margin-left: auto; font-size: 12px; opacity: .7; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 15px; font-weight: 500; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--accent); border-color: var(--accent); font-weight: 700; }
.chip .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }

/* 秤读数卡 */
.scale-card { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 10px 18px 12px; border-radius: 16px; background: #1f2a1c; color: #c9f2a8; text-align: center; box-shadow: 0 8px 24px rgba(40, 25, 10, .25); pointer-events: none; min-width: 150px; will-change: transform; }
.scale-card::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #1f2a1c; }
.sc-name { font-size: 15px; color: #e7f7d8; font-weight: 500; }
.sc-num { font-family: var(--font-mono); font-weight: 600; font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.sc-num small { font-family: var(--font-body); font-size: 20px; margin-left: 6px; font-weight: 700; }
.sc-water { font-size: 14px; color: #9fd8ef; margin-top: 4px; }
.sc-water b { font-family: var(--font-mono); }
.scale-card.empty .sc-num { opacity: .55; }

/* 预测浮层 */
.predict { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 14px; border-radius: 18px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 14px 40px rgba(60, 35, 10, .22); text-align: center; width: 300px; }
.predict h3 { margin: 0 0 10px; font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.predict .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pbtn { min-height: 64px; border-radius: 14px; border: 0; font-size: 20px; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pbtn svg { width: 24px; height: 24px; }
.pbtn.f { background: var(--float); } .pbtn.s { background: var(--sink); }
.predict .cancel { margin-top: 8px; border: 0; background: transparent; color: var(--ink-2); font-size: 14px; min-height: 36px; cursor: pointer; }

/* 提示条 */
.toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 84px); transform: translate(-50%, -8px); max-width: min(560px, calc(100% - 32px)); padding: 12px 20px; border-radius: 16px; background: rgba(42, 30, 18, .9); color: #fff; font-size: 17px; line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: rgba(23, 102, 63, .94); }

/* 弹窗 */
.modal-bg { position: absolute; inset: 0; background: rgba(40, 28, 14, .42); display: grid; place-items: center; padding: 16px; }
.modal-bg[hidden] { display: none; }
.modal { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel-solid); border-radius: 22px; padding: 22px; box-shadow: 0 20px 60px rgba(40, 25, 10, .3); display: flex; flex-direction: column; gap: 14px; }
.modal h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 27px; line-height: 1.25; text-wrap: balance; }
.modal .q { font-size: 19px; line-height: 1.5; margin: 0; font-weight: 500; }
.modal .opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; min-height: 56px; padding: 10px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-size: 17px; cursor: pointer; color: var(--ink); display: flex; gap: 10px; align-items: center; }
.opt b { font-family: var(--font-mono); color: var(--accent-deep); }
.opt.right { border-color: var(--float); background: var(--float-soft); }
.opt.wrong { border-color: var(--sink); background: var(--sink-soft); }
.fb { font-size: 16px; line-height: 1.6; padding: 12px 14px; border-radius: 12px; }
.fb.ok { background: var(--float-soft); color: #14553a; }
.fb.no { background: var(--sink-soft); color: #7d2c1b; }
.modal img.snap { width: 100%; border-radius: 14px; aspect-ratio: 16 / 9; object-fit: cover; }
.modal .row-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal .row-btns .big-btn { width: auto; padding: 0 22px; }
.insight { font-size: 18px; line-height: 1.65; margin: 0; }
.insight b { color: var(--accent-deep); }

/* 我的发现 */
.m5 { position: absolute; inset: calc(env(safe-area-inset-top, 0px) + 80px) 16px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; }
.m5[hidden] { display: none; }
.m5 .box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); min-width: 0; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.shot { border: 3px solid transparent; border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; background: #fff; text-align: left; }
.shot img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.shot span { display: block; padding: 6px 8px; font-size: 13.5px; color: var(--ink-2); }
.shot.on { border-color: var(--accent); }
.card { background: #fff; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 20px rgba(60, 35, 10, .1); }
.card .ph { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; color: var(--ink-3); font-size: 15px; overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; }
.card .sentence { font-size: 22px; line-height: 1.7; font-family: var(--font-display); }
.card .sentence .blank { color: var(--accent-deep); border-bottom: 2px dashed var(--accent); padding: 0 4px; }
.field { width: 100%; box-sizing: border-box; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); padding: 10px 12px; font: 17px/1.5 var(--font-body); color: var(--ink); background: #fff; resize: vertical; }
.foot { display: flex; flex-direction: column; gap: 6px; }
.foot .r { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.foot .r i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: #fff; background: var(--ink-3); flex: none; }
.foot .r i.y { background: var(--float); }
.show-card { position: absolute; inset: 0; background: #2a1f14; display: grid; place-items: center; padding: 24px; }
.show-card[hidden] { display: none; }
.show-card .card { width: min(1100px, 100%); max-height: 100%; }
.show-card .card .sentence { font-size: clamp(22px, 3.2vw, 40px); }

/* 物品架 */
.shelf-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; justify-content: center; pointer-events: none; }
.shelf { pointer-events: auto; display: flex; gap: 6px; padding: 8px; max-width: 100%; overflow-x: auto; background: rgba(255, 249, 238, .94); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px rgba(60, 35, 10, .16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); scrollbar-width: thin; }
.shelf[hidden] { display: none; }
.item { position: relative; flex: none; width: 100px; padding: 6px 4px 9px; border: 0; border-radius: 16px; background: transparent; cursor: grab; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 500 15.5px/1.2 var(--font-body); color: var(--ink); touch-action: none; transition: background .15s, transform .08s ease-out; }
.item.tool { cursor: pointer; }
.item:hover { background: rgba(226, 162, 28, .14); }
.item:active { transform: scale(.96); }
.item:disabled { opacity: .45; cursor: default; }
.item img, .item .ic { width: 72px; height: 72px; object-fit: contain; pointer-events: none; -webkit-user-drag: none; transition: opacity .2s, filter .2s; }
.item .ic { display: grid; place-items: center; color: var(--accent-deep); }
.item .ic svg { width: 44px; height: 44px; }
.item .where { position: absolute; top: 3px; right: 3px; font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 999px; color: #fff; display: none; }
.item.in-water img, .item.on-scale img { opacity: .45; filter: grayscale(.5); }
.item.in-water .where { display: block; background: var(--water); }
.item.on-scale .where { display: block; background: #4c6a2f; }
.item .cnt { position: absolute; top: 3px; right: 6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--accent-deep); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.item.flash { animation: flash .5s ease-out; }
.sep { width: 1px; background: var(--line); margin: 6px 4px; flex: none; }
@keyframes flash { 0% { background: rgba(226, 162, 28, .45); } 100% { background: transparent; } }

/* 物体标签 */
.tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; padding: 4px 5px 4px 11px; border-radius: 999px; background: var(--panel-solid); border: 1px solid var(--line); font-size: 16px; font-weight: 700; white-space: nowrap; color: var(--ink); will-change: transform; transition: opacity .2s; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.tag.plain { padding-right: 11px; }
.tag .st { display: none; align-items: center; gap: 3px; padding: 3px 9px 3px 6px; border-radius: 999px; color: #fff; font-size: 15px; }
.tag .st svg { width: 15px; height: 15px; }
.tag.float .st { display: inline-flex; background: var(--float); }
.tag.sink .st { display: inline-flex; background: var(--sink); }
.tag.middle .st { display: inline-flex; background: var(--mid); }
.tag.hide { opacity: 0; }

#loading { position: absolute; inset: 0; display: grid; place-items: center; background: #efe3d1; font-size: 18px; color: var(--ink-2); transition: opacity .5s; }
#loading.done { opacity: 0; pointer-events: none; }
.panel-toggle { display: none; }

@media (max-width: 1100px) {
  .mod span { display: none; }
  .mod { padding: 0 10px; }
  .panel { width: 300px; }
}
@media (max-width: 760px) {
  .top { flex-wrap: wrap; }
  .brand .name { font-size: 19px; }
  .mods { order: 3; width: 100%; justify-content: space-between; margin: 0; }
  .panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 128px; max-height: 46%; }
  .panel.collapsed .p-body { display: none; }
  .panel-toggle { display: inline-grid; }
  .item { width: 80px; font-size: 13.5px; }
  .item img, .item .ic { width: 56px; height: 56px; }
  .m5 { grid-template-columns: 1fr; overflow-y: auto; top: calc(env(safe-area-inset-top, 0px) + 140px); }
  .predict { width: 260px; }
  .sc-num { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { .item, .tag, .toast { transition: none; } .item.flash { animation: none; } }
</style>

<div id="app">
  <canvas id="c" aria-label="厨房实验台：水缸、量杯和秤"></canvas>
  <div id="labels"></div>

class Water {
  constructor() {
    const box = C.type === 'box';

      this.mask[j * this.nx + i] = box || Math.hypot(x - C.cx, z - C.cz) <= C.r + this.dx * 0.5 ? 1 : 0;
    }

  idx(i, j) { return j * this.nx + i; }
  sample(x, z) {

  }

    const i0 = clamp(Math.floor((x - r1 - C.x0) / this.dx), 0, this.nx - 1), i1 = clamp(Math.ceil((x + r1 - C.x0) / this.dx), 0, this.nx - 1);
    const j0 = clamp(Math.floor((z - r1 - C.z0) / this.dz), 0, this.nz - 1), j1 = clamp(Math.ceil((z + r1 - C.z0) / this.dz), 0, this.nz - 1);
    let c = 0;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = this.idx(i, j); if (!this.mask[k]) continue;
      const d = Math.hypot(C.x0 + i * this.dx - x, C.z0 + j * this.dz - z);
      if (d >= r0 && d <= r1) { fn(k, d); c++; }
    }

  }
  displace(x, z, R, dV) {
    if (!dV) return;
    const n = this.forCells(x, z, R * 0.9, R * 1.9, () => {}); if (!n) return;
    const amt = clamp(dV / (n * this.cellA), -0.02, 0.02);

  }

  poke(x, z, amt, r = 0.012) { if (!insideC(x, z)) return; this.forCells(x, z, 0, r, (k) => { this.v[k] += amt; }); }
  swirl(t, amt) { // 搅拌时水面中间稍微凹下去

    this.V = s.V; this.rb = s.rb; this.rho = def.rho; this.m = def.rho * s.V; this.vi = s.V / this.buoy.length;

  }

    this.pos.set(0, -5, 0); this.vel.set(0, 0, 0); this.w.set(0, 0, 0); this.sub = this.prevSub = this.subFrac = 0;
    this.inC = false; this.onPan = 0; this.steadyT = 0; this.reported = null; this.weighed = false; this.asleep = false;

}

      const b = world.bodies.find(x => x.id === it.id); if (!b) continue;
      const onScale = b.active && (b.onScale || b.onPan > 0), inW = b.active && !onScale;
      it.el.classList.toggle('in-water', inW); it.el.classList.toggle('on-scale', onScale);
      it.el.querySelector('.where').textContent = onScale ? '在秤上' : inW ? (world.stage === 'glass' ? '在杯里' : '在水里') : '';
    } else if (it.count) { const c = it.count(), el = it.el.querySelector('.cnt'); el.hidden = !c; el.textContent = c; }
    if (it.disabled) it.el.disabled = it.disabled();
  }
}

// ---------- 进入环节
function enterMod(id) {
  closeModal(); predictEl.hidden = true; showCard.hidden = true;
  mod = MODS.find(m => m.id === id);
  try { localStorage.setItem('fc3-mod', id); } catch (e) {}
  renderMods();
  $('pNo').textContent = `第 ${mod.no} 个实验`; $('pDskp').textContent = mod.dskp; $('pTitle').textContent = mod.title; $('pGoal').textContent = mod.goal;
  if (mod.stage) {
    m5El.hidden = true; canvas.style.visibility = ''; panel.hidden = false;
    if (world) world.dispose();
    world = new World(mod.stage, mod.objects);
    MODS_IMPL[id].setup && MODS_IMPL[id].setup();
    buildShelf();
    requestAnimationFrame(() => onResize());
    onResize();
  } else {
    if (world) { world.dispose(); world = null; }
    panel.hidden = true; shelfEl.hidden = true; scaleCard.hidden = true; canvas.style.visibility = 'hidden'; m5El.hidden = false;
  }
  scaleCard.hidden = !(world && world.stage === 'tank');
  scWater.hidden = id !== 'm2';
  renderPanel();
}
function renderPanel() { MODS_IMPL[mod.id].panel(); }
function markDone(id) { if (!S.done[id]) { S.done[id] = true; save(); renderMods(); } }

    if (cur >= 3) action = `<button class="big-btn" id="m4q">${S.done.m4 ? '再回答一次问题' : '回答问题'}</button><div class="note">还可以试试：把<b>软木塞、小番茄、葡萄</b>放进彩虹杯，看看它们停在哪一层。</div>`;
    const items = Object.entries(s.items).map(([id, w]) => `<tr><td>${OBJECT_DEFS[id].name}</td><td>${w}</td></tr>`).join('');
    pBody.innerHTML = stepsHtml(['把食用油倒进水里', '把炼奶倒进水里', '彩虹杯：5 种液体会怎么排？', '回答问题'], Math.min(cur, 3)) + action +
      `<div><p class="sec-title">杯子里现在（下 → 上）</p>${layersNow.length ? stack(layersNow, l => `<div class="lay" style="background:${'#' + l.color.getHexString()}${l.fam === 'milk' ? '' : '88'}">${LIQ[Object.keys(l.vols).sort((a, b) => l.vols[b] - l.vols[a])[0]].name}<small>${Math.round(l.vol)} mL</small></div>`) : '<div class="empty">杯子是空的</div>'}</div>` +

    const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
    on('m4pred', () => { this.predMode = true; s.pred = []; save(); renderPanel(); toast('点物品架上的液体，从最下面排起。'); });
    on('m4clr', () => { s.pred = []; save(); renderPanel(); });
    on('m4ok', () => { this.predMode = false; renderPanel(); toast(s.pred.length === 5 ? '好！现在按「倒掉重来」，再把液体倒进去。' : '还没排完 5 种，先倒倒看也可以。'); });
    on('m4q', () => quiz('m4', [
      { q: '为什么油会浮在水的上面？', opts: [{ t: '因为油比较少', why: '就算倒很多油，油还是在上面。' }, { t: '因为油的密度比水小', ok: true, why: '密度比水小的液体，会浮在水上面。' }, { t: '因为油是黄色的', why: '颜色和浮沉没有关系。' }] },
      { q: '炼奶为什么会沉到水的下面？', opts: [{ t: '炼奶的密度比水大', ok: true, why: '密度比水大的液体，会沉到水下面。' }, { t: '炼奶是白色的', why: '颜色和浮沉没有关系。' }, { t: '炼奶比较甜', why: '甜不甜不是原因，是密度。' }] },
    ], () => { markDone('m4'); renderPanel(); toast('第 4 个实验完成！', true); }));
  },
};

// ---------- 事件分派
function handleEvents() {
  const ev = world.events.splice(0); const m = MODS_IMPL[mod.id];
  if (m.tick) m.tick();
  for (const e of ev) {
    if (e.type === 'settled' && m.onSettled) m.onSettled(e.body, e.state);
    if (e.type === 'weighed' && m.onWeighed) m.onWeighed(e.body, e.grams);
    if (e.type === 'spoonDone' && m.onSpoonDone) m.onSpoonDone(e.kind, e.t);
    if (e.type === 'pourDone' && m.onPourDone) m.onPourDone(e.liq);
    if (e.type === 'layersSettled' && m.onLayersSettled) m.onLayersSettled();
  }
}

// ---------- 指针
const ndc = new THREE.Vector2();
let drag = null, holding = null;
const toNdc = (x, y) => ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
const shelfTop = () => shelfEl.hidden ? innerHeight : shelfEl.getBoundingClientRect().top;
let hintShown = false;
function hideHint() { hintShown = true; }
function tileDown(e, it) {
  e.preventDefault(); if (holding) return;
  const b = world.bodies.find(x => x.id === it.id); if (!b) return;
  if (b.active && !b.held && (b.onScale || b.onPan > 0)) { b.goHome(); world.dropInto(b); return; } // 秤上 → 放进水里
  if (b.active && !b.held) { b.goHome(); it.el.classList.add('flash'); setTimeout(() => it.el.classList.remove('flash'), 500); return; }
  drag = { b, x: e.clientX, y: e.clientY, moved: false, fromShelf: true, live: false, id: e.pointerId, it };
  try { it.el.setPointerCapture(e.pointerId); } catch (_) {}
}
canvas.addEventListener('pointerdown', (e) => {
  if (holding) return;
  const hit = world && world.pick(toNdc(e.clientX, e.clientY)); if (!hit) return;
  if (hit.jar) { MODS_IMPL[mod.id].spoon && MODS_IMPL[mod.id].spoon(hit.jar); return; }
  if (hit.body.held) return;
  drag = { b: hit.body, x: e.clientX, y: e.clientY, moved: false, fromShelf: false, live: true, id: e.pointerId };
  world.beginGrab(hit.body); const p = world.pointerWorld(toNdc(e.clientX, e.clientY)); if (p) hit.body.target.copy(p);
  canvas.classList.add('grabbing'); try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true;
  const b = drag.b, p = world.pointerWorld(toNdc(e.clientX, e.clientY)); if (!p) return;
  if (!drag.live) { if (e.clientY > shelfTop() - 10) return; b.placeAt(p.x, Math.max(0.03, p.y - b.R), p.z); world.beginGrab(b); drag.live = true; canvas.classList.add('grabbing'); }
  b.target.copy(p); b.hist.push({ t: performance.now(), p: p.clone() }); if (b.hist.length > 8) b.hist.shift();
});
function nearScale(x, y) { if (world.stage !== 'tank') return false; const s = world.scaleScreen(innerWidth, innerHeight); return Math.hypot(x - s.x, y - s.y) < Math.max(110, Math.min(innerWidth, innerHeight) * 0.16); }
function intoContainer(b, x) {
  const m = MODS_IMPL[mod.id];
  if (m.needPredict && m.needPredict(b.id)) { world.hold(b, x); holding = b; showPredict(b); return; }
}
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag, b = d.b; drag = null; canvas.classList.remove('grabbing'); hideHint();
  if (d.fromShelf && !d.moved) { // 点一下：放进水里
    const m = MODS_IMPL[mod.id];
    if (m.needPredict && m.needPredict(b.id)) { world.hold(b, C.cx + (C.type === 'box' ? R(-0.1, 0.1) : 0)); holding = b; showPredict(b); }
    else world.dropInto(b);
    return;
  }
  if (!d.live) return;
  b.grabbed = false;
  if (!d.moved) return;
  if (nearScale(e.clientX, e.clientY)) { world.putOnScale(b); return; }
  const p = world.pointerWorld(toNdc(e.clientX, e.clientY));
  const over = p && p.x > C.x0 - 0.03 && p.x < C.x1 + 0.03 && e.clientY < shelfTop() - 10;
  if (!over) { b.goHome(); const t = tiles.find(t => t.id === b.id); if (t) { t.el.classList.add('flash'); setTimeout(() => t.el.classList.remove('flash'), 500); } return; }
  const m = MODS_IMPL[mod.id];
  if (m.needPredict && m.needPredict(b.id)) { world.hold(b, p.x); holding = b; showPredict(b); return; }
  if (C.type === 'box') { b.pos.x = clamp(b.pos.x, C.x0 + b.R, C.x1 - b.R); b.pos.z = clamp(b.pos.z, C.z0 + b.R, C.z1 - b.R); }
  else if (b.pos.y < C.rim + b.R) { b.pos.x = C.cx; b.pos.z = C.cz; }
  else { b.pos.x = clamp(b.pos.x, C.cx - C.r * 0.5, C.cx + C.r * 0.5); b.pos.z = C.cz; }
  const hst = b.hist.filter(q => performance.now() - q.t < 110);
  if (hst.length >= 2) { const a = hst[0], z = hst[hst.length - 1]; const dt = Math.max(0.016, (z.t - a.t) / 1000); const v = z.p.clone().sub(a.p).divideScalar(dt); v.z = 0; if (v.length() > 3) v.setLength(3); b.vel.copy(v); }
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
function showPredict(b) { $('predictQ').textContent = `你猜，${b.name}会……`; predictEl.hidden = false; predictEl.querySelector('.pbtn').focus(); }
predictEl.querySelectorAll('[data-guess]').forEach(btn => btn.addEventListener('click', () => {
  if (!holding) return; const b = holding; holding = null; predictEl.hidden = true;
  S.m1.res[b.id] = { pred: btn.dataset.guess }; save(); world.release(b); renderPanel();
}));
$('predictCancel').addEventListener('click', () => { if (!holding) return; holding.goHome(); holding = null; predictEl.hidden = true; });

$('slowBtn').addEventListener('click', () => { slow = !slow; $('slowBtn').setAttribute('aria-pressed', String(slow)); toast(slow ? '慢动作：看清楚东西是怎样浮、怎样沉的。' : '恢复正常速度。'); });
$('snapBtn').addEventListener('click', () => { if (!world) { toast('先进入一个实验，再拍照。'); return; } requestSnap(`${mod.short}（自己拍的）`); toast('拍好了！照片放在「我的发现」里。', true); });
$('panelToggle').addEventListener('click', () => { panel.classList.toggle('collapsed'); onResize(); });

// ---------- 缩图
function renderThumbs() {
  const size = 160, r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r2.setSize(size, size, false); r2.setPixelRatio(1); r2.toneMapping = THREE.ACESFilmicToneMapping; r2.outputColorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(r2), env = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const shoot = (key, obj, elev = 0.55) => {
    const sc = new THREE.Scene(); sc.environment = env; sc.environmentIntensity = 0.7;
    sc.add(new THREE.HemisphereLight('#fff4e0', '#8a6a4a', 0.8)); const dl = new THREE.DirectionalLight('#ffe6c4', 2.6); dl.position.set(-1, 2, 1.5); sc.add(dl); sc.add(obj);
    const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length() / 2;
    const cam = new THREE.PerspectiveCamera(28, 1, 0.001, 10);
    cam.position.copy(c).add(new THREE.Vector3(0, elev, 1).normalize().multiplyScalar(rad / Math.tan(THREE.MathUtils.degToRad(14)) * 0.8)); cam.lookAt(c);
    r2.render(sc, cam); THUMBS[key] = r2.domElement.toDataURL('image/png');
    sc.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  };
  for (const id in OBJECT_DEFS) { const d = OBJECT_DEFS[id], m = d.build(d.shape, d), r = d.restRot || [0, 0, 0]; m.rotation.set(r[0], r[1] + 0.5, r[2]); shoot(id, m); }
  for (const id of ['oil', 'milk', 'honey', 'soap', 'bluewater']) shoot('b-' + id, buildBottle(id), 0.3);
  shoot('jar-salt', buildJar('salt'), 0.3); shoot('jar-sugar', buildJar('sugar'), 0.3);
  pm.dispose(); r2.dispose(); try { r2.forceContextLoss(); } catch (_) {}
}

// ---------- 画质
let frames = 0, acc = 0, degradeStep = 0;
function watchPerf(dt) {
  frames++; acc += dt;
  if (acc > 3) { const fps = frames / acc; frames = 0; acc = 0;
    if (fps < 32 && degradeStep === 0) { degradeStep = 1; pixelRatio = 1; renderer.setPixelRatio(1); onResize(); }
    else if (fps < 26 && degradeStep === 1) { degradeStep = 2; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.needsUpdate = true; } }
}

// ---------- 主回圈
let last = performance.now(), firstFrame = true;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (document.hidden || !world) return;
  watchPerf(dt);
  if (slow) dt *= 0.25;
  world.update(dt);
  renderer.render(world.scene, world.camera);
  if (snapReq) { snaps.push({ url: renderer.domElement.toDataURL('image/jpeg', 0.82), label: snapReq }); if (snaps.length > 16) snaps.shift(); snapReq = null; }
  world.updateLabels(innerWidth, innerHeight);
  handleEvents();
  if (world.stage === 'tank') {
    const sc = world.scaleScreen(innerWidth, innerHeight);
    scaleCard.style.transform = `translate(${sc.x}px, ${sc.cardY}px) translate(-50%, -100%)`;
    const g = Math.round(world.balanceShown), nm = world.scaleBody ? world.scaleBody.name : '把东西拖到秤上';
    if (g !== world._g || nm !== world._nm) {
      world._g = g; world._nm = nm; scNum.textContent = Math.max(0, g); scName.textContent = nm; scaleCard.classList.toggle('empty', !world.scaleBody);
      if (world.scaleBody) scWaterG.textContent = Math.round(volCm3(world.scaleBody.id));
      scWater.hidden = mod.id !== 'm2' || !world.scaleBody;
    }
  }
  if (holding) { // 按钮位置固定，不跟着物体晃，小朋友才点得准
    const s = world.screenOf(new THREE.Vector3(holding.holdX ?? C.cx, C.rim + 0.07 + holding.R + 0.02, C.cz), innerWidth, innerHeight);
    const x = Math.round(clamp(s.x, 160, innerWidth - 160)), y = Math.round(Math.max(s.y, 200));
    if (Math.abs(x - (predictEl._x || 0)) > 2 || Math.abs(y - (predictEl._y || 0)) > 2) { predictEl._x = x; predictEl._y = y; predictEl.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`; }
  }
  updateShelf();
  if (firstFrame) { firstFrame = false; $('loading').classList.add('done'); }
}

// 测试钩子
window.__fc = { get world() { return world; }, get S() { return S; }, enterMod, MODS_IMPL, snaps, step: (sec) => { for (let t = 0; t < sec; t += 1 / 60) world.update(1 / 60); handleEvents(); } };

(async function boot() {
  try { await Promise.race([Promise.all(['40px "ZCOOL KuaiLe"', '600 40px "IBM Plex Mono"', '40px "Noto Sans SC"'].map(f => document.fonts.load(f, '盐糖炼奶蜂蜜油洗洁精0123456789g'))), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  renderer.setSize(innerWidth, innerHeight, false);
  renderThumbs();
  let start = 'm1'; try { start = localStorage.getItem('fc3-mod') || start; } catch (e) {}
  if (!MODS.find(m => m.id === start)) start = 'm1';
  enterMod(start);
  if (!world) $('loading').classList.add('done');
  requestAnimationFrame(loop);
})();
